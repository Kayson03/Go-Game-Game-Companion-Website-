<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loginBox">
        <div class="formBox active" id="loginForm">
            <form action="" id="loginFormEl">
                <h2>Login</h2>
                <input type="email" name="email" placeholder="Email" required> 
                <input type="password" name="password" placeholder="Password" required> 
                <button type="submit" name="login">Login</button>
                <p>Don't have an account? <a href="#" onclick="showForm('registerForm')">Register</a></p>
            </form>
            <div class="testing-shortcuts">
                <p class="testing-label">Testing shortcuts (skip login)</p>
                <a href="#" onclick="testLogin('user')">Jump to Player view</a>
                <a href="#" onclick="testLogin('provider')">Jump to Companion view</a>
            </div>
        </div>

        <div class="formBox" id="registerForm">
            <form action="" id="registerFormEl">
                <h2>Register</h2>
                <input type="text" name="name" placeholder="Name" required> 
                <input type="email" name="email" placeholder="Email" required> 
                <input type="password" name="password" placeholder="Password" required> 
                <select name="role" id="roleSelect" required>
                    <option value="">--Select Role--</option>
                    <option value="user">Player (looking for a companion)</option>
                    <option value="provider">Game Companion (offering services)</option>
                </select>
                <button type="submit" name="register">Create Account</button>
                <p>Already have an account? <a href="#" onclick="showForm('loginForm')">Login</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
